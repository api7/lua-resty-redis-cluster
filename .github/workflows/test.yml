name: Test

on:
  push:
    branches: [devel]
  pull_request:
    branches: [devel]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENRESTY_PREFIX: /usr/local/openresty
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Follow the OpenResty/Test::Nginx setup used by api7/lua-resty-ipmatcher.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl gnupg lsb-release build-essential cpanminus perl redis-server openssl
          curl -fsSL --retry 3 https://openresty.org/package/pubkey.gpg \
            | sudo gpg --dearmor --yes -o /usr/share/keyrings/openresty.gpg
          echo "deb [signed-by=/usr/share/keyrings/openresty.gpg] https://openresty.org/package/ubuntu $(lsb_release -sc) main" \
            | sudo tee /etc/apt/sources.list.d/openresty.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openresty
          sudo cpanm --notest --mirror https://cpan.metacpan.org --mirror-only Test::Nginx
          # Install LuaCov v0.16.0 for the existing sanity suite.
          curl -fsSL --retry 3 https://codeload.github.com/lunarmodules/luacov/tar.gz/2634de4f4ad366ebd266d884eecd01c3ccc61ec8 \
            | tar -xz -C "$RUNNER_TEMP"
          sudo cp -r "$RUNNER_TEMP/luacov-2634de4f4ad366ebd266d884eecd01c3ccc61ec8/src/luacov"* "$OPENRESTY_PREFIX/lualib/"
          "$OPENRESTY_PREFIX/bin/openresty" -V
          redis-server --version
          perl -MTest::Nginx -e 'print "Test::Nginx $Test::Nginx::VERSION\n"'

      - name: Run full test suite
        shell: bash
        run: bash t/run-ci.sh 2>&1 | tee test.log

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-logs
          path: |
            test.log
            t/servroot/logs/
            t/fixtures-run/**/*.log
          if-no-files-found: ignore
